name: Update Token List

on:
  # Run every 2 hours = 12 times per day for maximum token discovery
  schedule:
    - cron: '*/30 * * * *'

  # Allow manual trigger
  workflow_dispatch:

  # Run on push to main (for testing)
  push:
    branches:
      - main

jobs:
  update-token-list:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install @solana/web3.js

      - name: Run token list updater
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: node scripts/update-token-list.js

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code tokens.json || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push if changed
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add tokens.json
          git commit -m "Update token list - $(date +'%Y-%m-%d %H:%M:%S')"
          git push

      - name: No changes
        if: steps.git-check.outputs.changed != 'true'
        run: echo "No changes to token list"
