name: Update Trending Tokens
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  update-trending:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch trending tokens
        run: node scripts/update-trending.js
      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code trending.json || echo "changed=true" >> $GITHUB_OUTPUT
      - name: Commit and push if changed
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add trending.json
          git commit -m "Update trending - $(date +'%Y-%m-%d %H:%M')"
          git push
